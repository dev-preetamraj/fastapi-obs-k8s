apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 1000
      # Placeholder: once Tempo lands, point datasourceUid at it to make
      # trace_id values in log lines clickable. See TODOS.md #1.
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id":\s*"([a-f0-9]{32})"'
          url: ''
          datasourceUid: ''
